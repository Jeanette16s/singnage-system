<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能公示语词库系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        /* ================= 全局基础 & 变量覆盖 ================= */
        :root {
            --el-color-primary: #35564C; 
            --el-color-success: #5C807B; 
            --el-color-warning: #F2A950; 
            --el-color-danger: #B65D4F; 
            --el-color-info: #757E7A;
            --el-bg-color: #ffffff; 
            --el-bg-color-page: #F8F5F0; 
            --el-text-color-primary: #1A201C; 
            --el-text-color-regular: #4A5550;
            --el-border-color-light: #EAE6DF; 
            --el-border-radius-base: 8px;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--el-bg-color-page); color: var(--el-text-color-primary); }
        #app { height: 100vh; display: flex; overflow: hidden; }
        [v-cloak] { display: none !important; }
        h1, h2, h3, .zh-title, .el-dialog__title { font-family: "Georgia", "Times New Roman", serif; letter-spacing: 0.5px; }

        /* ================= 登录页面专属样式 ================= */
        .login-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--el-bg-color-page); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: #ffffff; border-radius: 24px; padding: 50px 45px; width: 380px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.04); text-align: center; transition: all 0.3s ease; }
        .login-card h2 { color: #000; margin-bottom: 10px; font-size: 28px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; }
        .login-card p { color: #666; margin-bottom: 35px; font-size: 14px; }
        .login-card .el-input__wrapper { background-color: #fff; box-shadow: 0 0 0 1px #E0E0E0 inset; border-radius: 12px; padding: 4px 15px; }
        .login-card .el-input__wrapper.is-focus { box-shadow: 0 0 0 1px #000 inset; }
        .login-card .el-form-item { margin-bottom: 22px; }
        .login-btn { width: 100%; border-radius: 12px; margin-top: 10px; height: 48px; font-size: 16px; font-weight: 600; background-color: var(--el-color-warning); border: none; color: #fff; }
        .login-btn:hover { background-color: #E59F4A; }
        .toggle-link-container { margin-top: 30px; font-size: 13px; color: #888; }
        .toggle-link { cursor: pointer; color: #000; font-weight: bold; margin-left: 5px; }
        .toggle-link:hover { text-decoration: underline; }

        /* ================= 主系统界面样式 ================= */
        .sidebar-brand { position: absolute; top: 0; left: 0; width: 260px; padding: 35px 25px; box-sizing: border-box; background-color: var(--el-color-primary); color: #F4F2EC; z-index: 10; }
        .sidebar-brand h1 { font-size: 22px; margin: 0 0 8px 0; font-weight: 700; color: #fff;}
        .sidebar-brand p { font-size: 13px; margin: 0; opacity: 0.7; letter-spacing: 1px;}
        .user-info { position: absolute; bottom: 30px; left: 25px; color: rgba(244, 242, 236, 0.8); font-size: 13px; z-index: 10; display: flex; align-items: center; gap: 10px; }

        .main-layout-tabs { width: 100%; height: 100vh; }
        .main-layout-tabs > .el-tabs__header { width: 260px !important; background-color: var(--el-color-primary); margin-right: 0 !important; border-right: none !important; }
        .main-layout-tabs > .el-tabs__header .el-tabs__nav-wrap { padding-top: 130px; }
        .main-layout-tabs > .el-tabs__header .el-tabs__nav-wrap::after { display: none; }
        .main-layout-tabs > .el-tabs__header .el-tabs__active-bar { display: none; }
        .main-layout-tabs > .el-tabs__header .el-tabs__item { color: rgba(244, 242, 236, 0.6) !important; height: 56px; line-height: 56px; text-align: left; padding: 0 30px !important; font-size: 15px; font-weight: 500; transition: all 0.3s ease; justify-content: flex-start; }
        .main-layout-tabs > .el-tabs__header .el-tabs__item:hover { color: #fff !important; }
        .main-layout-tabs > .el-tabs__header .el-tabs__item.is-active { color: #fff !important; background-color: rgba(255, 255, 255, 0.1); border-right: 4px solid var(--el-color-warning); font-weight: 600; }
        .main-layout-tabs > .el-tabs__content { flex: 1; height: 100vh; overflow-y: auto; padding: 40px 50px !important; box-sizing: border-box; background-color: var(--el-bg-color-page); }

        /* 侧边栏菜单图标样式 */
        .custom-tabs-label { display: flex; align-items: center; gap: 10px; font-size: 15px; }
        .custom-tabs-label .el-icon { font-size: 18px; opacity: 0.9; }

        .search-bar { max-width: 700px; margin: 0 auto 40px auto; display: flex; align-items: stretch; gap: 15px; background: var(--el-bg-color); padding: 12px 15px; border-radius: 16px; border: 1px solid var(--el-border-color-light); box-shadow: 0 8px 20px rgba(0,0,0,0.03); }
        .search-bar .el-textarea__inner { border: none; box-shadow: none; background: transparent; font-size: 15px; resize: none; }
        .search-bar .el-button { border-radius: 12px; font-weight: 600; padding: 0 25px; height: auto; }

        .box-card, .el-card { border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--el-border-color-light) !important; box-shadow: 3px 3px 0px rgba(213, 207, 193, 0.5) !important; background-color: var(--el-bg-color) !important; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .box-card:hover { transform: translateY(-2px); box-shadow: 5px 5px 0px rgba(213, 207, 193, 0.6) !important; }
        .el-card__header { border-bottom: 1px dashed var(--el-border-color-light); padding: 18px 20px; }
        .zh-title { font-size: 19px; font-weight: bold; color: var(--el-text-color-primary); }

        .el-tag { border-radius: 6px; border: none; font-weight: 600; }
        .el-tag--primary { background-color: #E6EBE9; color: var(--el-color-primary); }
        .el-tag--success { background-color: #EAF0EF; color: var(--el-color-success); }
        .el-tag--warning { background-color: #FBF4E8; color: var(--el-color-warning); }
        .el-tag--danger  { background-color: #F7EAE8; color: var(--el-color-danger); }
        .el-tag--info    { background-color: #EEF0EF; color: var(--el-color-info); }

        .translation-row { display: flex; align-items: center; margin-bottom: 12px; padding: 10px 15px; background: #F8F7F4; border-radius: 10px; border: 1px solid var(--el-border-color-lighter); }
        .translation-tag { font-size: 16px; font-weight: 500; margin-right: 20px; flex: 1; }
        .action-btns { opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateX(-10px); }
        .translation-row:hover .action-btns { opacity: 1; transform: translateX(0); }
        .action-btns .el-button { border-radius: 8px; border-width: 2px; font-weight: bold; }
        
        .delete-trans-btn { color: #C0C4CC; cursor: pointer; margin-left: 15px; padding: 2px; display: flex; align-items: center; border-radius: 50%; transition: all 0.2s ease; }
        .delete-trans-btn:hover { color: var(--el-color-danger); background-color: #F7EAE8; }

        .asso-container { margin-top: 20px; border-top: 1px dashed var(--el-border-color-light); padding-top: 15px; }
        .asso-list { background-color: #F4F2EC; padding: 15px; border-radius: 10px; margin-top: 12px; border: 1px solid var(--el-border-color-lighter); }
        .asso-item { padding: 8px 0; border-bottom: 1px solid #EAE6DF; }
        .asso-zh { color: var(--el-text-color-primary); font-size: 14px; }
        .asso-en { color: var(--el-color-info); font-size: 13px; font-weight: 500;}

        .el-upload-dragger { background-color: var(--el-bg-color) !important; border: 2px dashed var(--el-border-color-light) !important; border-radius: 12px; padding: 40px 0; transition: all 0.3s; }
        .el-upload-dragger:hover { border-color: var(--el-color-primary) !important; background-color: #F8F7F4 !important; }
        .el-table { border-radius: 10px; border: 1px solid var(--el-border-color-light); overflow: hidden; }
        .el-table th.el-table__cell { background-color: #EFECE6 !important; color: var(--el-text-color-primary); font-weight: bold; }
        .el-dialog { border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .el-dialog__header { background-color: var(--el-bg-color-page); border-bottom: 1px solid var(--el-border-color-light); padding-bottom: 20px; margin-right: 0;}
        .el-dialog__footer { background-color: #F8F7F4; border-top: 1px solid var(--el-border-color-lighter); }
    </style>
</head>
<body>
<div id="app" v-cloak>

    <div v-if="!isLoggedIn" class="login-wrapper">
        <div class="login-card">
            <h2>{{ isRegisterMode ? 'Sign up' : 'System Login' }}</h2>
            <p>{{ isRegisterMode ? 'Create an account to access the hub' : 'Hey, Enter your details to get sign in to your account' }}</p>
            
            <el-form v-if="!isRegisterMode" :model="loginForm" @keyup.enter="handleLogin">
                <el-form-item>
                    <el-input v-model="loginForm.username" placeholder="Username" size="large"></el-input>
                </el-form-item>
                <el-form-item>
                    <el-input v-model="loginForm.password" type="password" placeholder="Passcode" size="large" show-password></el-input>
                </el-form-item>
                
                <el-button class="login-btn" :loading="isLoggingIn" @click="handleLogin">Sign in</el-button>
                
                <div class="toggle-link-container">
                    Don't have an account? <span class="toggle-link" @click="isRegisterMode = true">Request Now</span>
                </div>
            </el-form>

            <el-form v-else :model="registerForm" @keyup.enter="handleRegister">
                <el-form-item>
                    <el-input v-model="registerForm.username" placeholder="Choose a Username" size="large"></el-input>
                </el-form-item>
                <el-form-item>
                    <el-input v-model="registerForm.password" type="password" placeholder="Create Passcode (Min 6)" size="large" show-password></el-input>
                </el-form-item>
                <el-form-item>
                    <el-input v-model="registerForm.confirmPassword" type="password" placeholder="Confirm Passcode" size="large" show-password></el-input>
                </el-form-item>
                
                <el-button class="login-btn" :loading="isRegistering" @click="handleRegister">Create Account</el-button>
                
                <div class="toggle-link-container">
                    Already have an account? <span class="toggle-link" @click="isRegisterMode = false">Sign in</span>
                </div>
            </el-form>
        </div>
    </div>

    <template v-else>
        <div class="sidebar-brand">
            <h1>公示语系统</h1>
            <p>BILINGUAL SIGNAGE HUB</p>
        </div>
        <div class="user-info">
            <el-avatar :size="30" style="background-color: var(--el-color-warning);">{{ username.charAt(0).toUpperCase() }}</el-avatar>
            <div>
                <div style="font-weight: bold;">{{ username }}</div>
                <div style="font-size: 11px; opacity: 0.7;">
                    {{ userRole === 'admin' ? '系统超级管理' : (userRole === 'editor' ? '编辑权限人员' : '仅限浏览查阅') }}
                </div>
            </div>
            <el-button link type="info" size="small" @click="handleLogout" style="margin-left: auto; color: #fff;">退出</el-button>
        </div>

        <el-tabs tab-position="left" class="main-layout-tabs">
            <el-tab-pane>
                <template #label>
                    <span class="custom-tabs-label">
                        <el-icon><Search /></el-icon>
                        <span>词库查询</span>
                    </span>
                </template>
                <div class="search-bar">
                    <el-input type="textarea" :autosize="{ minRows: 1, maxRows: 3 }" v-model="searchKeyword" placeholder="输入中文标语进行检索..." @keydown.enter.prevent="handleSearch" style="flex: 1;"></el-input>
                    <el-button @click="handleSearch" type="primary">搜索</el-button>
                </div>
                <el-empty v-if="searchResults.length === 0" description="暂无搜索结果" image-size="120"></el-empty>
                <el-card class="box-card" v-for="item in searchResults" :key="item.zh_text">
                    <template #header>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div><span class="zh-title">{{ item.zh_text }}</span></div>
                            <el-tag :type="getCategoryType(item.category)">{{ item.category }}</el-tag>
                        </div>
                    </template>
                    <div style="margin-bottom: 10px;">
                        <span style="font-weight: 600; color: var(--el-color-primary); font-size: 13px; text-transform: uppercase;">Standard Translations</span>
                        <div style="margin-top: 12px;">
                            <div v-for="en in item.translations" :key="en" class="translation-row">
                                <span class="translation-tag">{{ en }}</span>
                                <div class="action-btns">
                                    <el-button size="small" type="primary" plain @click="copyText(en)">复制</el-button>
                                    <el-button v-if="hasEditPermission" size="small" type="warning" plain @click="openSearchEditDialog(item.zh_text, en, item.category)">编辑</el-button>
                                </div>
                                <div v-if="hasEditPermission" class="delete-trans-btn" @click="deleteTranslation(item.zh_text, en)" title="删除此译文">
                                    <el-icon><Close /></el-icon>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div v-if="item.associated_items && item.associated_items.length > 0" class="asso-container">
                        <el-button type="info" link @click="item.show_assoc = !item.show_assoc"><span style="font-weight: bold;">{{ item.show_assoc ? '收起关联 ▲' : '显示关联 ▼' }}</span></el-button>
                        <div v-show="item.show_assoc" class="asso-list">
                            <div v-for="asso in item.associated_items" :key="asso.zh_text" class="asso-item">
                                <div class="asso-zh">{{ asso.order }}. {{ asso.zh_text }}</div><div class="asso-en">{{ asso.en_texts.join(' / ') }}</div>
                            </div>
                        </div>
                    </div>
                </el-card>
            </el-tab-pane>

            <el-tab-pane>
                <template #label>
                    <span class="custom-tabs-label">
                        <el-icon><Document /></el-icon>
                        <span>文档比对</span>
                    </span>
                </template>
                <el-card shadow="never" style="margin-bottom: 25px; border-style: dashed !important;">
                    <template #header><h3 style="margin:0;">上传 Word 或 Excel 文档进行精确比对</h3></template>
                    <el-upload drag action="" :http-request="matchUpload" :show-file-list="false" accept=".docx, .doc, .xlsx" :disabled="isMatching">
                        <el-icon class="el-icon--upload" style="color: var(--el-color-primary); font-size: 48px; margin-bottom: 15px;"><upload-filled /></el-icon>
                        <div class="el-upload__text">拖拽 Word (.docx) 或 Excel (.xlsx) 到此处，或 <em>点击上传</em></div>
                        <div class="el-upload__tip" style="margin-top: 12px; color: #888; line-height: 1.5;">
                            系统将自动提取文档中的中文标识，并与线上词库进行查重匹配。<br/>
                            <span style="color: #E6A23C;">*注：若上传 Excel，必须包含名为“公示语中文”的表头。</span>
                        </div>
                    </el-upload>
                    <div v-if="isMatching" style="margin-top: 20px;">
                        <el-progress :percentage="matchPercent" :text-inside="true" :stroke-width="20" :status="matchPercent === 100 ? 'success' : ''" striped striped-flow></el-progress>
                        <div style="text-align: center; margin-top: 10px; font-weight: bold;">{{ matchStatusText }}</div>
                    </div>
                </el-card>

                <div v-if="matchResults.length > 0">
                    <h3 style="margin-bottom: 20px; color: var(--el-color-primary); display: flex; align-items: center;">
                        <el-icon style="margin-right: 8px;"><Trophy /></el-icon> 找到了 {{ matchResults.length }} 个已有词条
                    </h3>
                    <el-card class="box-card" v-for="item in matchResults" :key="item.zh_text">
                        <template #header><div style="display: flex; justify-content: space-between;"><span class="zh-title">{{ item.zh_text }}</span><el-tag :type="getCategoryType(item.category)">{{ item.category }}</el-tag></div></template>
                        <div style="margin-bottom: 10px;">
                            <div v-for="en in item.translations" :key="en" class="translation-row">
                                <span class="translation-tag">{{ en }}</span>
                                <div class="action-btns">
                                    <el-button size="small" type="primary" plain @click="copyText(en)">复制</el-button>
                                    <el-button v-if="hasEditPermission" size="small" type="warning" plain @click="openSearchEditDialog(item.zh_text, en, item.category)">编辑</el-button>
                                </div>
                                <div v-if="hasEditPermission" class="delete-trans-btn" @click="deleteTranslation(item.zh_text, en)" title="删除此译文">
                                    <el-icon><Close /></el-icon>
                                </div>
                            </div>
                        </div>
                    </el-card>
                </div>
                <el-empty v-else-if="hasMatched" description="此文档提取出的文本，未在当前词库中匹配到任何内容" image-size="120"></el-empty>
            </el-tab-pane>

            <el-tab-pane v-if="hasEditPermission">
                <template #label>
                    <span class="custom-tabs-label">
                        <el-icon><Edit /></el-icon>
                        <span>数据录入</span>
                    </span>
                </template>
                <el-row :gutter="25">
                    <el-col :span="11">
                        <el-card shadow="never">
                            <template #header>
                                <h3 style="margin:0; display: flex; align-items: center;">
                                    单条手动录入
                                </h3>
                            </template>
                            <el-form :model="singleForm" label-position="top">
                                <el-form-item label="中文标语"><el-input type="textarea" v-model="singleForm.zh_text"></el-input></el-form-item>
                                <el-form-item label="英文翻译"><el-input type="textarea" v-model="singleForm.en_text"></el-input></el-form-item>
                                <el-button type="primary" size="large" @click="submitSingle" :loading="isSubmitting" style="width: 100%;">提交入库</el-button>
                            </el-form>
                        </el-card>
                    </el-col>
                    <el-col :span="13">
                        <el-card shadow="never" style="height: 100%;">
                            <template #header>
                                <h3 style="margin:0; display: flex; align-items: center;">
                                    <el-icon style="margin-right: 8px;"><FolderOpened /></el-icon>批量文件上传
                                </h3>
                            </template>
                            <el-upload drag action="" :http-request="customUpload" :show-file-list="false" accept=".xlsx, .docx, .doc" :disabled="uploading">
                                <el-icon class="el-icon--upload" style="color: var(--el-color-primary); font-size: 48px;"><upload-filled /></el-icon>
                                <div class="el-upload__text">拖拽文件到此处，或 <em>点击上传</em></div>
                            </el-upload>
                            <div v-if="uploading" style="margin-top: 20px;">
                                <el-progress :percentage="uploadPercent" :text-inside="true" :stroke-width="20"></el-progress>
                                <div style="text-align: center; margin-top: 10px;">{{ uploadStatusText }}</div>
                            </div>
                        </el-card>
                    </el-col>
                </el-row>
            </el-tab-pane>

            <el-tab-pane>
                <template #label>
                    <span class="custom-tabs-label">
                        <el-icon><Clock /></el-icon>
                        <span>历史记录</span>
                    </span>
                </template>
                <el-card shadow="never" style="height: calc(100vh - 80px); display: flex; flex-direction: column;">
                    <div style="margin-bottom: 20px; display: flex; gap: 15px;">
                        <el-select v-model="historyFilterCategory" placeholder="全部分类" @change="fetchHistory" clearable><el-option label="提示类" value="提示类"></el-option><el-option label="指示类" value="指示类"></el-option></el-select>
                        <el-button type="success" @click="exportHistory">
                            <el-icon style="margin-right: 4px;"><Download /></el-icon>导出
                        </el-button>
                        <el-button @click="fetchHistory">刷新</el-button>
                    </div>
                    <el-table :data="historyData" style="width: 100%; flex: 1;" height="100%" stripe>
                        <el-table-column prop="created_at" label="时间" width="160"><template #default="scope">{{ formatDate(scope.row.created_at) }}</template></el-table-column>
                        <el-table-column prop="action_type" label="类型" width="100"></el-table-column>
                        <el-table-column prop="zh_term" label="中文原文" min-width="180"></el-table-column>
                        <el-table-column prop="en_translation" label="英文译文" min-width="180"></el-table-column>
                        <el-table-column v-if="hasEditPermission" label="操作" width="140" fixed="right" align="center">
                            <template #default="scope">
                                <el-button size="small" type="primary" link @click="openHistoryEditDialog(scope.row)">编辑</el-button>
                                <el-button size="small" type="danger" link @click="deleteHistoryRecord(scope.row)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </el-card>
            </el-tab-pane>

            <el-tab-pane v-if="userRole === 'admin'">
                <template #label>
                    <span class="custom-tabs-label">
                        <el-icon><User /></el-icon>
                        <span>用户管理</span>
                    </span>
                </template>
                <el-card shadow="never" style="height: calc(100vh - 80px); display: flex; flex-direction: column;">
                    <template #header>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 style="margin:0;">系统账号权限分配</h3>
                            <el-button icon="Refresh" circle @click="fetchUsers"></el-button>
                        </div>
                    </template>
                    <el-alert title="新注册的用户默认为【浏览者】。您可以在下方直接通过下拉框为其提升至【编辑者】权限。" type="info" show-icon style="margin-bottom: 20px;"></el-alert>
                    
                    <el-table :data="usersData" style="width: 100%;" stripe>
                        <el-table-column prop="id" label="ID" width="80"></el-table-column>
                        <el-table-column prop="username" label="用户名" min-width="150"></el-table-column>
                        <el-table-column label="系统权限 (角色)" min-width="200">
                            <template #default="scope">
                                <el-select v-if="scope.row.username !== 'admin'" v-model="scope.row.role" size="small" style="width: 150px" @change="updateRole(scope.row.id, scope.row.role)">
                                    <el-option label="浏览者 (Viewer)" value="viewer"></el-option>
                                    <el-option label="编辑者 (Editor)" value="editor"></el-option>
                                    <el-option label="管理员 (Admin)" value="admin"></el-option>
                                </el-select>
                                <el-tag v-else type="danger" disable-transitions>Super Admin (不可更改)</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="100" align="center">
                            <template #default="scope">
                                <el-button v-if="scope.row.username !== 'admin'" size="small" type="danger" link @click="deleteUser(scope.row.id)">强制注销</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </el-card>
            </el-tab-pane>

        </el-tabs>
    </template>

    <el-dialog title="编辑词库条目" v-model="searchEditDialogVisible" width="550px">
        <el-form :model="searchEditForm" label-position="top">
            <el-form-item label="中文标语"><el-input v-model="searchEditForm.new_zh" type="textarea" :rows="2"></el-input></el-form-item>
            <el-form-item label="英文译文"><el-input v-model="searchEditForm.new_en" type="textarea" :rows="2"></el-input></el-form-item>
            <el-form-item label="词条分类">
                <el-select v-model="searchEditForm.category" style="width: 100%;">
                    <el-option label="提示类" value="提示类"></el-option><el-option label="强制类" value="强制类"></el-option>
                    <el-option label="限制类" value="限制类"></el-option><el-option label="指示类" value="指示类"></el-option>
                    <el-option label="未分类" value=""></el-option>
                </el-select>
            </el-form-item>
        </el-form>
        <template #footer><el-button @click="searchEditDialogVisible = false">取消</el-button><el-button type="primary" @click="submitSearchEdit" :loading="isEditingSearch">保存</el-button></template>
    </el-dialog>

    <el-dialog title="编辑历史操作记录" v-model="historyEditDialogVisible" width="550px">
        <el-form :model="historyEditForm" label-position="top">
            <el-form-item label="中文标语"><el-input v-model="historyEditForm.zh_term" type="textarea" :rows="2"></el-input></el-form-item>
            <el-form-item label="英文译文"><el-input v-model="historyEditForm.en_translation" type="textarea" :rows="2"></el-input></el-form-item>
            <el-form-item label="词条分类">
                <el-select v-model="historyEditForm.category" style="width: 100%;">
                    <el-option label="提示类" value="提示类"></el-option><el-option label="强制类" value="强制类"></el-option>
                    <el-option label="限制类" value="限制类"></el-option><el-option label="指示类" value="指示类"></el-option>
                </el-select>
            </el-form-item>
        </el-form>
        <template #footer><el-button @click="historyEditDialogVisible = false">取消</el-button><el-button type="primary" @click="submitHistoryEdit" :loading="isEditingHistory">保存</el-button></template>
    </el-dialog>

</div>

<script>
    axios.interceptors.request.use(config => {
        const token = localStorage.getItem('token');
        if (token) config.headers.Authorization = `Bearer ${token}`;
        return config;
    });

    axios.interceptors.response.use(response => response, error => {
        if (error.response && (error.response.status === 401 || error.response.status === 403)) {
            ElementPlus.ElMessage.error(error.response.data.detail || '操作被拒绝，请检查权限');
            if (error.response.status === 401) {
                localStorage.clear(); window.location.reload(); 
            }
        }
        return Promise.reject(error);
    });

    const App = {
        data() {
            return {
                isLoggedIn: !!localStorage.getItem('token'),
                userRole: localStorage.getItem('role') || 'viewer',
                username: localStorage.getItem('username') || '',
                
                isRegisterMode: false,
                loginForm: { username: '', password: '' }, isLoggingIn: false,
                registerForm: { username: '', password: '', confirmPassword: '' }, isRegistering: false,
                
                usersData: [],

                searchKeyword: '', searchResults: [],
                singleForm: { zh_text: '', en_text: '' }, isSubmitting: false,
                historyData: [], historyFilterCategory: '',
                uploading: false, uploadPercent: 0, uploadStatusText: '',
                isMatching: false, matchPercent: 0, matchStatusText: '', matchResults: [], hasMatched: false,
                
                searchEditDialogVisible: false, isEditingSearch: false,
                searchEditForm: { old_zh: '', old_en: '', new_zh: '', new_en: '', category: '' },
                historyEditDialogVisible: false, isEditingHistory: false,
                historyEditForm: { id: null, zh_term: '', en_translation: '', category: '' }
            }
        },
        computed: {
            hasEditPermission() { return this.userRole === 'admin' || this.userRole === 'editor'; }
        },
        mounted() {
            if (this.isLoggedIn) {
                this.verifyToken();
            }
        },
        methods: {
            verifyToken() {
                axios.get('/api/verify_token').then(res => {
                    if (res.data.status === 'success') {
                        this.userRole = res.data.role;
                        this.username = res.data.username;
                        this.fetchHistory();
                        if (this.userRole === 'admin') this.fetchUsers();
                    }
                }).catch(() => {});
            },
            
            handleLogin() {
                if(!this.loginForm.username || !this.loginForm.password) return ElementPlus.ElMessage.warning('请输入账号密码');
                this.isLoggingIn = true;
                const fd = new URLSearchParams(); 
                fd.append('username', this.loginForm.username); fd.append('password', this.loginForm.password);
                axios.post('/api/login', fd).then(res => {
                    localStorage.setItem('token', res.data.access_token); localStorage.setItem('role', res.data.role); localStorage.setItem('username', res.data.username);
                    this.isLoggedIn = true; this.userRole = res.data.role; this.username = res.data.username;
                    ElementPlus.ElMessage.success('欢迎回来！');
                    this.fetchHistory();
                    if (this.userRole === 'admin') this.fetchUsers();
                }).finally(() => { this.isLoggingIn = false; });
            },
            
            handleRegister() {
                if(!this.registerForm.username || !this.registerForm.password) return ElementPlus.ElMessage.warning('请填写完整的账号密码');
                if(this.registerForm.password !== this.registerForm.confirmPassword) return ElementPlus.ElMessage.warning('两次输入的密码不一致！');
                
                this.isRegistering = true;
                const fd = new FormData();
                fd.append('username', this.registerForm.username);
                fd.append('password', this.registerForm.password);
                
                axios.post('/api/register', fd).then(res => {
                    if(res.data.status === 'success') {
                        ElementPlus.ElMessage.success(res.data.msg);
                        this.isRegisterMode = false; 
                        this.loginForm.username = this.registerForm.username; 
                        this.registerForm = { username: '', password: '', confirmPassword: '' };
                    } else { ElementPlus.ElMessage.error(res.data.msg); }
                }).finally(() => { this.isRegistering = false; });
            },
            
            handleLogout() { localStorage.clear(); this.isLoggedIn = false; this.searchResults = []; },
            fetchUsers() { axios.get('/api/users').then(res => { this.usersData = res.data.data; }); },
            
            updateRole(userId, newRole) {
                const fd = new FormData();
                fd.append('user_id', userId); fd.append('role', newRole);
                axios.post('/api/users/role', fd).then(res => {
                    if(res.data.status === 'success') { ElementPlus.ElMessage.success(res.data.msg); }
                    else { ElementPlus.ElMessage.error(res.data.msg); this.fetchUsers(); }
                });
            },
            
            deleteUser(id) {
                ElementPlus.ElMessageBox.confirm(`确定要强制注销该账号吗？`, '警告', { type: 'error' }).then(() => {
                    const fd = new FormData(); fd.append('user_id', id);
                    axios.post('/api/users/delete', fd).then(res => {
                        if(res.data.status === 'success') { ElementPlus.ElMessage.success(res.data.msg); this.fetchUsers(); }
                        else ElementPlus.ElMessage.error(res.data.msg);
                    });
                }).catch(() => {});
            },

            handleSearch() {
                if(!this.searchKeyword) return;
                axios.get('/api/search', { params: { keyword: this.searchKeyword } }).then(res => {
                    this.searchResults = res.data.data;
                    if(this.searchResults.length === 0) ElementPlus.ElMessage.warning('未能匹配到结果');
                });
            },
            copyText(text) {
                if(navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(() => ElementPlus.ElMessage.success('已复制')); } 
                else { let t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); ElementPlus.ElMessage.success('已复制'); t.remove(); }
            },
            openSearchEditDialog(zh_text, en_text, category) { this.searchEditForm = { old_zh: zh_text, old_en: en_text, new_zh: zh_text, new_en: en_text, category: category || '' }; this.searchEditDialogVisible = true; },
            submitSearchEdit() {
                this.isEditingSearch = true; const fd = new FormData(); fd.append('old_zh', this.searchEditForm.old_zh); fd.append('old_en', this.searchEditForm.old_en); fd.append('new_zh', this.searchEditForm.new_zh); fd.append('new_en', this.searchEditForm.new_en); fd.append('category', this.searchEditForm.category);
                axios.post('/api/edit_signage', fd).then(res => { if (res.data.status === 'success') { ElementPlus.ElMessage.success(res.data.msg); this.searchEditDialogVisible = false; this.handleSearch(); this.fetchHistory(); } else ElementPlus.ElMessage.error(res.data.msg); }).finally(() => { this.isEditingSearch = false; });
            },

            deleteTranslation(zh, en) {
                ElementPlus.ElMessageBox.confirm(`确定要删除译文 "${en}" 吗？此操作无法撤销。`, '删除警告', { type: 'warning' }).then(() => {
                    const fd = new FormData();
                    fd.append('zh_term', zh); fd.append('en_translation', en);
                    axios.post('/api/delete_signage', fd).then(res => {
                        if(res.data.status === 'success') {
                            ElementPlus.ElMessage.success(res.data.msg);
                            this.handleSearch(); 
                            this.fetchHistory(); 
                        } else {
                            ElementPlus.ElMessage.error(res.data.msg);
                        }
                    });
                }).catch(() => {});
            },

            submitSingle() {
                this.isSubmitting = true; const fd = new FormData(); fd.append('zh_text', this.singleForm.zh_text); fd.append('en_text', this.singleForm.en_text);
                axios.post('/api/add_single', fd).then(res => { ElementPlus.ElMessage.success(res.data.msg); this.singleForm.zh_text = ''; this.singleForm.en_text = ''; this.fetchHistory(); }).finally(() => { this.isSubmitting = false; })
            },
            
            matchUpload(options) {
                const formData = new FormData(); 
                formData.append('file', options.file);
                const fileName = options.file.name.toLowerCase();
                let url = '';
                
                if (fileName.endsWith('.doc')) {
                    ElementPlus.ElMessage.warning('请将 .doc 另存为 .docx 后再进行比对！');
                    options.onError(); return;
                } else if (fileName.endsWith('.docx')) {
                    url = '/api/match_docx';
                } else if (fileName.endsWith('.xlsx')) {
                    url = '/api/match_excel';
                } else {
                    ElementPlus.ElMessage.error('仅支持 .docx 或 .xlsx 格式的文件！');
                    options.onError(); return;
                }

                this.isMatching = true; this.matchPercent = 0; this.matchStatusText = '正在解析文件并匹配...';
                
                axios.post(url, formData, { 
                    onUploadProgress: p => { 
                        this.matchPercent = Math.round((p.loaded * 100) / p.total); 
                        if (this.matchPercent === 100) this.matchStatusText = '解析完成，数据库极速匹配中...';
                    } 
                }).then(res => {
                    if (res.data.status === 'success') { 
                        this.matchResults = res.data.data; 
                        this.hasMatched = true; 
                        ElementPlus.ElNotification({ title: '比对完毕', message: `共提取 ${res.data.extracted_count} 个有效词条，在库中命中 ${this.matchResults.length} 个！`, type: 'success' });
                        options.onSuccess(res.data); 
                    } else { 
                        ElementPlus.ElMessage.error(res.data.msg); 
                        options.onError(); 
                    }
                }).catch(err => {
                    ElementPlus.ElMessage.error('解析失败，请检查文件格式或重试');
                    options.onError();
                }).finally(() => { 
                    setTimeout(() => { this.isMatching = false; }, 800); 
                });
            },
            
            customUpload(options) {
                const formData = new FormData(); formData.append('file', options.file);
                let url = options.file.name.endsWith('.xlsx') ? '/api/upload_excel' : '/api/upload_docx';
                this.uploading = true; this.uploadPercent = 0; this.uploadStatusText = '上传处理中...';
                axios.post(url, formData, { onUploadProgress: p => { this.uploadPercent = Math.round((p.loaded * 100) / p.total); } }).then(res => {
                    if (res.data.status === 'success') { ElementPlus.ElMessage.success(res.data.msg); this.fetchHistory(); options.onSuccess(res.data); } else { ElementPlus.ElMessage.error(res.data.msg); options.onError(); }
                }).finally(() => { setTimeout(() => { this.uploading = false; }, 1000); });
            },
            
            fetchHistory() { 
                axios.get('/api/history', { params: { category: this.historyFilterCategory, limit: 100 } }).then(res => { this.historyData = res.data.data; }); 
            },
            
            openHistoryEditDialog(row) { this.historyEditForm = { id: row.id, zh_term: row.zh_term, en_translation: row.en_translation, category: row.category }; this.historyEditDialogVisible = true; },
            submitHistoryEdit() {
                this.isEditingHistory = true; const fd = new FormData(); fd.append('id', this.historyEditForm.id); fd.append('zh_term', this.historyEditForm.zh_term); fd.append('en_translation', this.historyEditForm.en_translation); fd.append('category', this.historyEditForm.category);
                axios.post('/api/history/update', fd).then(res => { if(res.data.status === 'success') { ElementPlus.ElMessage.success(res.data.msg); this.historyEditDialogVisible = false; this.fetchHistory(); } }).finally(() => { this.isEditingHistory = false; });
            },
            deleteHistoryRecord(row) {
                ElementPlus.ElMessageBox.confirm(`确定删除?`, '警告', { type: 'error' }).then(() => {
                    const fd = new FormData(); fd.append('id', row.id); axios.post('/api/history/delete', fd).then(res => { if(res.data.status === 'success') { ElementPlus.ElMessage.success(res.data.msg); this.fetchHistory(); } });
                }).catch(() => {});
            },
            exportHistory() { 
                axios.get(`/api/export_history?category=${encodeURIComponent(this.historyFilterCategory)}`, { responseType: 'blob' }).then(res => {
                    const url = window.URL.createObjectURL(new Blob([res.data])); const link = document.createElement('a'); link.href = url; link.setAttribute('download', '词库新增与编辑记录.xlsx'); document.body.appendChild(link); link.click(); link.remove();
                }); 
            },
            getCategoryType(cat) { const map = { '强制类': 'danger', '提示类': 'warning', '限制类': 'info', '指示类': 'success' }; return map[cat] || 'primary'; },
            
            formatDate(dateStr) { 
                if(!dateStr) return ''; 
                return dateStr.replace('T', ' ').substring(0, 19);
            }
        }
    };
    
    const app = Vue.createApp(App);
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) { 
        app.component(key, component); 
    }
    app.use(ElementPlus);
    app.mount('#app');
</script>
</body>
</html>
